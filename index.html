<!DOCTYPE html>
<html>
<head>
<title>DSS CRM</title>
<style>
body {
  font-family: Arial;
  background: #eaf0f8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.login {
  background: white;
  padding: 40px;
  width: 300px;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 4px 20px #ccc;
}
input {
  width: 90%;
  padding: 12px;
  margin: 10px 0;
}
button {
  width: 100%;
  padding: 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>
<body>
<div class="login">
<h2>DSS CRM</h2>
<p>Data Static Solution</p>
<input placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
</div>
</body>
</html>
