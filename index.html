<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>DSS CRM | Login</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,
    #0f172a, #1d4ed8);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 38px;
  border-radius: 16px;
  box-shadow: 0 20px 60px #0004;
}

.logo {
  background: #1d4ed8;
  color: white;
  width: 65px;
  height: 65px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: bold;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
  color: #0f172a;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
  color: #334155;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
}

input:focus {
  outline: 2px solid #93c5fd;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.note {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">DSS</div>

  <h1>DSS CRM</h1>
  <p class="subtitle">
    Data Static Solution
  </p>

  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username"
      type="text"
      placeholder="Enter your username"
      autocomplete="username"
      required>

    <label for="password">Password</label>
    <input id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required>

    <button type="submit">
      Sign In
    </button>
  </form>

  <p class="note">
    Authorized Personnel Only
  </p>
  <p class="note">
    Demo interface - authentication pending
  </p>
</div>

<script>
document.getElementById("loginForm")
  .addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Secure login setup is coming next.");
  });
</script>

</body>
</html>
